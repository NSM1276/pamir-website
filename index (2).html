<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #080a0f;
    --border: rgba(255,255,255,0.07);
    --accent: #e8ff47;
    --text: #f0f0ef;
    --muted: rgba(240,240,239,0.38);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .noise {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px;
  }

  .glow-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 2;
  }
  .blob1 { width: 420px; height: 420px; background: rgba(232,255,71,0.055); top: -120px; right: -100px; }
  .blob2 { width: 320px; height: 320px; background: rgba(80,120,255,0.045); bottom: -80px; left: -80px; }

  .wrap {
    position: relative;
    z-index: 10;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    border-radius: 100px;
    padding: 5px 16px 5px 10px;
    font-size: 11px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 40px;
    backdrop-filter: blur(8px);
    opacity: 0;
    animation: fadeUp 0.8s 0.2s ease forwards;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.65); }
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(56px, 10vw, 118px);
    line-height: 0.9;
    letter-spacing: -0.035em;
    text-align: center;
    opacity: 0;
    animation: fadeUp 0.9s 0.4s ease forwards;
  }

  h1 span {
    color: var(--accent);
  }

  .sub {
    margin-top: 32px;
    font-size: clamp(14px, 1.8vw, 16px);
    font-weight: 300;
    color: var(--muted);
    text-align: center;
    max-width: 360px;
    line-height: 1.75;
    opacity: 0;
    animation: fadeUp 0.9s 0.6s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="noise"></div>
<div class="glow-blob blob1"></div>
<div class="glow-blob blob2"></div>

<div class="wrap">
  <div class="badge"><span class="dot"></span>Under construction</div>
  <h1>We'll be<br>back <span>soon.</span></h1>
  <p class="sub">We're currently working on something new. The site will be up shortly — check back later.</p>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.size = Math.random() * 1.1 + 0.2;
    this.speedX = (Math.random() - 0.5) * 0.22;
    this.speedY = (Math.random() - 0.5) * 0.22;
    this.alpha = Math.random() * 0.3 + 0.05;
    this.color = Math.random() > 0.85 ? '#e8ff47' : '#ffffff';
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset();
  }
  draw() {
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

for (let i = 0; i < 80; i++) particles.push(new Particle());

function loop() {
  ctx.clearRect(0, 0, W, H);
  particles.forEach(p => { p.update(); p.draw(); });
  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
